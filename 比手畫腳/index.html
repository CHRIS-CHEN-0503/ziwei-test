<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>歡樂比手畫腳 🎭 (兒童語音專用版)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Fredoka', 'Noto Sans TC', 'sans-serif'],
          },
          animation: {
            'bounce-slow': 'bounce 2s infinite',
            'pulse-fast': 'pulse 1s infinite',
          }
        }
      }
    }
  </script>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .text-shadow-fun {
      text-shadow: 2px 2px 0px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-amber-200 via-rose-200 to-teal-200 min-h-screen text-slate-800 font-sans flex flex-col justify-between overflow-x-hidden">

  <!-- APP CONTAINER -->
  <div id="app" class="max-w-md w-full mx-auto min-h-screen flex flex-col justify-between p-4 relative">

    <!-- 1. HOME SCREEN (主功能表) -->
    <div id="screen-home" class="flex-1 flex flex-col justify-between py-2">
      <!-- Title & Header -->
      <div class="text-center my-4">
        <div class="flex justify-start mb-2">
          <a href="../" class="inline-flex items-center gap-1.5 bg-white/80 backdrop-blur px-3 py-1.5 rounded-full text-xs font-bold text-slate-700 border border-white shadow-sm active:scale-95 transition no-underline">
            🏠 學習樂園
          </a>
        </div>
        <div class="inline-block bg-white/60 backdrop-blur px-4 py-1.5 rounded-full text-xs font-bold text-amber-700 mb-2 border border-amber-300 shadow-sm">
          <i class="fa-solid font-bold fa-child-reaching mr-1"></i> 專為 5~9 歲兒童設計
        </div>
        <h1 class="text-4xl font-extrabold text-rose-600 tracking-wide text-shadow-fun flex items-center justify-center gap-2">
          <span>🎭</span> 兒童比手畫腳
        </h1>
        <p class="text-sm font-bold text-amber-900 mt-1">👂 悄悄話語音：貼近耳朵聽題目！</p>
      </div>

      <!-- Settings Panel -->
      <div class="glass-card rounded-3xl p-5 shadow-xl border-2 border-white/80 space-y-4 my-auto">
        <!-- Mode Selection -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">
            <i class="fa-solid fa-sliders text-rose-500 mr-1"></i> 抽題模式
          </label>
          <div class="grid grid-cols-2 gap-2">
            <button id="btn-mode-random" onclick="setMode('random')" class="py-2.5 px-3 rounded-2xl font-bold text-sm border-2 transition-all flex items-center justify-center gap-2 bg-rose-500 text-white border-rose-600 shadow-md">
              <i class="fa-solid fa-shuffle"></i> 隨機抽題
            </button>
            <button id="btn-mode-seq" onclick="setMode('sequential')" class="py-2.5 px-3 rounded-2xl font-bold text-sm border-2 transition-all flex items-center justify-center gap-2 bg-slate-100 text-slate-600 border-slate-300">
              <i class="fa-solid fa-list-ol"></i> 順序/指定
            </button>
          </div>
        </div>

        <!-- Timer Setting -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">
            <i class="fa-solid fa-clock text-amber-500 mr-1"></i> 每局時間
          </label>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="setTimer(30)" class="btn-time py-2 rounded-xl text-xs font-bold border-2 bg-slate-100 border-slate-300" data-time="30">30 秒</button>
            <button onclick="setTimer(60)" class="btn-time py-2 rounded-xl text-xs font-bold border-2 bg-rose-500 text-white border-rose-600 shadow" data-time="60">60 秒</button>
            <button onclick="setTimer(90)" class="btn-time py-2 rounded-xl text-xs font-bold border-2 bg-slate-100 border-slate-300" data-time="90">90 秒</button>
          </div>
        </div>

        <!-- Whisper Volume Setting -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs font-bold text-slate-600">
              <i class="fa-solid fa-volume-low text-indigo-500 mr-1"></i> 耳語音量 (預設極小聲)
            </label>
            <span id="volume-val" class="text-xs font-bold text-indigo-600">8%</span>
          </div>
          <div class="flex items-center gap-2">
            <input id="volume-slider" type="range" min="1" max="40" value="8" oninput="updateVolume(this.value)" class="w-full accent-indigo-500 cursor-pointer">
            <button onclick="testWhisper()" class="px-2.5 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded-lg border border-indigo-300 whitespace-nowrap active:scale-95">
              🔊 試聽
            </button>
          </div>
          <p class="text-[11px] text-slate-500 mt-1">💡 語音非常小聲，表演者可邊看螢幕邊貼近耳邊聽題。</p>
        </div>

        <!-- BGM Toggle -->
        <div class="flex justify-between items-center pt-2 border-t border-slate-200">
          <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <i class="fa-solid fa-music text-teal-500"></i> 8-bit 電玩背景音樂
          </span>
          <button id="btn-bgm-toggle" onclick="toggleBGM()" class="px-3 py-1 bg-teal-500 text-white text-xs font-bold rounded-full transition shadow">
            已開啟
          </button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="space-y-2.5 my-4">
        <button onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-black text-2xl rounded-2xl shadow-lg border-b-4 border-emerald-700 active:translate-y-1 active:border-b-0 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-play"></i> 開始比手畫腳！
        </button>

        <button onclick="openTopicModal()" class="w-full py-3 bg-white hover:bg-slate-50 text-slate-700 font-bold text-sm rounded-2xl shadow border-2 border-slate-200 flex items-center justify-center gap-2">
          <i class="fa-solid fa-boxes-stacked text-amber-500"></i> 管理 / 新增題目 (<span id="topic-count-badge">100</span>題)
        </button>
      </div>
    </div>

    <!-- 2. GAME PLAY SCREEN (遊戲中) -->
    <div id="screen-game" class="hidden flex-1 flex flex-col justify-between py-2">
      <!-- Game Top Bar -->
      <div class="glass-card rounded-2xl p-3 flex justify-between items-center shadow-md border border-white">
        <!-- Score -->
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 rounded-full bg-amber-400 text-amber-900 flex items-center justify-center font-black text-xl shadow-inner">
            🏆
          </div>
          <div>
            <div class="text-[10px] font-bold text-slate-500 uppercase">目前得分</div>
            <div id="game-score" class="text-xl font-black text-slate-800">0</div>
          </div>
        </div>

        <!-- Timer -->
        <div class="text-right">
          <div class="text-[10px] font-bold text-slate-500 uppercase">剩餘時間</div>
          <div id="game-timer" class="text-2xl font-black text-rose-600">60s</div>
        </div>
      </div>

      <!-- Main Topic Card (直接可見) -->
      <div class="my-auto py-2">
        <div class="glass-card rounded-3xl p-6 shadow-2xl border-4 border-white text-center relative overflow-hidden flex flex-col items-center">
          <!-- Category Tag -->
          <div class="inline-block bg-teal-100 text-teal-800 text-xs font-bold px-3 py-1 rounded-full mb-3 shadow-sm border border-teal-200" id="card-category">
            🐾 動作體驗
          </div>

          <!-- Direct Topic Display Area -->
          <div class="my-2 min-h-[100px] flex items-center justify-center w-full">
            <div id="card-topic-text" class="text-4xl font-black text-slate-800 tracking-wide leading-tight">
              猴子吃香蕉
            </div>
          </div>

          <!-- 公布答案提示（複誦中才顯示） -->
          <div id="announce-banner" class="hidden w-full mt-1 py-2 rounded-2xl bg-emerald-100 border border-emerald-300 text-emerald-800 text-sm font-black animate-pulse-fast">
            📢 公布答案中…
          </div>

          <!-- Audio Replay Button -->
          <button onclick="speakCurrentTopic()" class="mt-4 px-5 py-2.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-2xl border border-indigo-300 active:scale-95 transition flex items-center justify-center gap-2 text-xs font-bold shadow-sm">
            <span>🔊 聽小語音播報</span>
            <span class="text-[10px] text-indigo-500">(靠近耳朵聽)</span>
          </button>
        </div>
      </div>

      <!-- Game Action Buttons -->
      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <button onclick="handleAnswer(true)" class="btn-answer py-5 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xl rounded-2xl shadow-lg border-b-4 border-emerald-700 active:translate-y-1 active:border-b-0 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle-check text-2xl"></i> 猜對了 (+1)
          </button>
          <button onclick="handleAnswer(false)" class="btn-answer py-5 bg-amber-500 hover:bg-amber-600 text-white font-black text-xl rounded-2xl shadow-lg border-b-4 border-amber-700 active:translate-y-1 active:border-b-0 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-forward text-2xl"></i> 跳過 (PASS)
          </button>
        </div>
        <button onclick="endGame()" class="w-full py-2 bg-slate-200 hover:bg-slate-300 text-slate-600 font-bold text-xs rounded-xl transition">
          提前結束這一局
        </button>
      </div>
    </div>

    <!-- 3. GAME OVER SCREEN (結算) -->
    <div id="screen-result" class="hidden flex-1 flex flex-col justify-between py-4 text-center">
      <div class="my-auto space-y-4">
        <div class="text-6xl animate-bounce">🎉</div>
        <h2 class="text-3xl font-black text-slate-800">時間到！遊戲結束</h2>
        
        <div class="glass-card rounded-3xl p-6 shadow-xl border-2 border-white max-w-xs mx-auto">
          <div class="text-xs font-bold text-slate-500 uppercase">本局總得分</div>
          <div id="final-score" class="text-6xl font-black text-rose-500 my-2">8</div>
          <div class="text-xs font-bold text-amber-600">太厲害了！掌聲鼓勵 👏👏👏</div>
        </div>

        <!-- Answer History -->
        <div class="glass-card rounded-2xl p-4 text-left max-h-48 overflow-y-auto space-y-1 border border-white text-xs">
          <div class="font-bold text-slate-500 mb-2 border-b pb-1">本局答題紀錄：</div>
          <div id="result-list" class="space-y-1">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>

      <div class="space-y-2">
        <button onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-emerald-400 to-teal-500 text-white font-black text-xl rounded-2xl shadow-lg border-b-4 border-emerald-700 active:translate-y-1 active:border-b-0 transition">
          <i class="fa-solid fa-rotate-right mr-1"></i> 再玩一局
        </button>
        <button onclick="showScreen('screen-home')" class="w-full py-3 bg-white text-slate-700 font-bold text-sm rounded-2xl shadow border border-slate-200">
          返回主選單
        </button>
      </div>
    </div>

  </div>

  <!-- TOPIC MANAGEMENT MODAL (題目庫編輯彈窗) -->
  <div id="modal-topics" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="glass-card w-full max-w-md rounded-3xl p-5 shadow-2xl border-2 border-white flex flex-col max-h-[85vh]">
      <!-- Modal Header -->
      <div class="flex justify-between items-center border-b pb-3 mb-3">
        <h3 class="font-black text-lg text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-rose-500"></i> 題目庫管理
        </h3>
        <button onclick="closeTopicModal()" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 font-bold flex items-center justify-center">✕</button>
      </div>

      <!-- Add Topic Form -->
      <div class="space-y-2 mb-4 bg-white/70 p-3 rounded-2xl border border-slate-200">
        <div class="text-xs font-bold text-slate-600">新增題目 (給5~9歲小孩)</div>
        <div class="flex gap-2">
          <input id="input-new-topic" type="text" placeholder="例如：兔子跳跳跳" class="flex-1 px-3 py-2 text-sm border rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-400" />
          <select id="select-new-cat" class="px-2 py-2 text-xs border rounded-xl bg-white font-bold text-slate-700">
            <option value="🐱 動物">🐱 動物</option>
            <option value="🏃 動作">🏃 動作</option>
            <option value="🦸 角色">🦸 角色</option>
            <option value="🍕 生活">🍕 生活</option>
          </select>
        </div>
        <button onclick="addNewTopic()" class="w-full py-2 bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs rounded-xl shadow transition">
          ➕ 新增至題目庫
        </button>
      </div>

      <!-- Topic List -->
      <div class="flex-1 overflow-y-auto pr-1 space-y-1.5" id="topic-list-container">
        <!-- Rendered via JS -->
      </div>

      <!-- Modal Footer -->
      <div class="pt-3 border-t mt-3 flex justify-between items-center">
        <button onclick="resetDefaultTopics()" class="text-xs text-rose-600 font-bold hover:underline">
          🔄 重設為預設題庫
        </button>
        <button onclick="closeTopicModal()" class="px-4 py-2 bg-slate-800 text-white font-bold text-xs rounded-xl">
          完成
        </button>
      </div>
    </div>
  </div>

      { text: "消防員噴水滅火", cat: "🦸 角色" },
      { text: "警察指揮交通", cat: "🦸 角色" },
      { text: "醫生幫病人看病", cat: "🦸 角色" },
      { text: "機器人走路跳舞", cat: "🦸 角色" },
      { text: "太空人在月球上走路", cat: "🦸 角色" },
      { text: "蜘蛛人射出蜘蛛絲", cat: "🦸 角色" },
      { text: "皮卡丘放電", cat: "🦸 角色" },
      { text: "超人飛上天", cat: "🦸 角色" },
      { text: "老師在黑板上寫字", cat: "🦸 角色" },
      { text: "廚師炒菜", cat: "🦸 角色" },
      { text: "司機開公車", cat: "🦸 角色" },
      { text: "郵差送信", cat: "🦸 角色" },
      { text: "農夫種菜", cat: "🦸 角色" },
      { text: "歌手拿麥克風唱歌", cat: "🦸 角色" },
      { text: "畫家在畫畫", cat: "🦸 角色" },
      { text: "海盜找寶藏", cat: "🦸 角色" },
      { text: "國王坐在王位上", cat: "🦸 角色" },
      { text: "忍者偷偷走路", cat: "🦸 角色" },
      { text: "牛仔騎馬", cat: "🦸 角色" }
    ];

    /* ===================================================
       2. 全局遊戲狀態 (State)
       =================================================== */
    let topics = [];
    let activeTopicPool = [];
    let currentTopicIndex = 0;
    let score = 0;
    let timerSeconds = 60;
    let currentRemainingTime = 60;
    let timerInterval = null;
    let gameMode = 'random'; // 'random' or 'sequential'
    let whisperVolume = 0.08; // 預設微弱音量 8%
    let bgmEnabled = true;
    let answerHistory = [];
    let isAnnouncing = false; // 是否正在大聲複誦答案
    let gameActive = false;   // 這一局是否還在進行中

    /* ===================================================
       3. 初始化與載入
       =================================================== */
    window.onload = () => {
      loadTopicsFromStorage();
      updateTopicBadgeCount();
      initAudioEngine();
    };

    // 題庫改版時把版本號 +1，舊使用者下次開啟會自動換成新題庫
    const TOPICS_VERSION = '2';

    function loadTopicsFromStorage() {
      const saved = localStorage.getItem('charades_kids_topics');
      const savedVersion = localStorage.getItem('charades_topics_version');

      // 沒存過、或存的是舊版題庫（用字較難、只有 50 題）→ 換成新題庫
      if (!saved || savedVersion !== TOPICS_VERSION) {
        topics = [...DEFAULT_TOPICS];
        saveTopicsToStorage();
        return;
      }
      try {
        topics = JSON.parse(saved);
      } catch (e) {
        topics = [...DEFAULT_TOPICS];
      }
    }

    function saveTopicsToStorage() {
      localStorage.setItem('charades_kids_topics', JSON.stringify(topics));
      localStorage.setItem('charades_topics_version', TOPICS_VERSION);
      updateTopicBadgeCount();
    }

    function updateTopicBadgeCount() {
      document.getElementById('topic-count-badge').innerText = topics.length;
    }

    /* ===================================================
       4. 語音合成 (TTS - Soft Whisper Volume)
       =================================================== */
    function speakCurrentTopic() {
      if (activeTopicPool.length === 0 || currentTopicIndex >= activeTopicPool.length) return;
      const currentItem = activeTopicPool[currentTopicIndex];
      
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // 停止前一次播放

        const utterance = new SpeechSynthesisUtterance(currentItem.text);
        utterance.lang = 'zh-TW';
        utterance.volume = whisperVolume; // 關鍵：很小聲
        utterance.rate = 0.85; // 速度稍慢適合小朋友聽清

        window.speechSynthesis.speak(utterance);
      } else {
        alert('您的瀏覽器不支援語音播放功能');
      }
    }

    function updateVolume(val) {
      whisperVolume = parseFloat(val) / 100;
      document.getElementById('volume-val').innerText = val + '%';
    }

    function testWhisper() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const testUtt = new SpeechSynthesisUtterance("這是有好聽的耳語聲音，請貼近耳朵。");
        testUtt.lang = 'zh-TW';
        testUtt.volume = whisperVolume;
        testUtt.rate = 0.85;
        window.speechSynthesis.speak(testUtt);
      }
    }

    /* ===================================================
       5. 音效與背景音樂引擎 (Web Audio API)
       =================================================== */
    let audioCtx = null;
    let bgmOsc = null;
    let bgmTimer = null;

    function initAudioEngine() {
      // AudioContext 延遲至用戶點擊開啟
    }

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function toggleBGM() {
      bgmEnabled = !bgmEnabled;
      const btn = document.getElementById('btn-bgm-toggle');
      if (bgmEnabled) {
        btn.innerText = "已開啟";
        btn.className = "px-3 py-1 bg-teal-500 text-white text-xs font-bold rounded-full transition shadow";
      } else {
        btn.innerText = "已關閉";
        btn.className = "px-3 py-1 bg-slate-300 text-slate-600 text-xs font-bold rounded-full transition";
        stopBGM();
      }
    }

    /* ---------------------------------------------------
       原創 8-bit 電玩風背景音樂
       方波主旋律 + 三角波低音，營造復古紅白機的輕快感。
       旋律為自行編寫，未使用任何市售遊戲的既有配樂。
       --------------------------------------------------- */
    const NOTE_HZ = {
      C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00,
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00,
      C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00,
      R: 0 // 休止符
    };
    // 每格為一個十六分音符，兩軌長度必須相同
    const BGM_MELODY = [
      'G4','C5','E5','G5',  'E5','C5','D5','E5',
      'F5','E5','D5','C5',  'D5','R' ,'G4','R' ,
      'A4','C5','F5','A5',  'F5','C5','D5','E5',
      'G5','F5','E5','D5',  'C5','R' ,'R' ,'R'
    ];
    const BGM_BASS = [
      'C3','R' ,'G3','R' ,  'C3','R' ,'G3','R' ,
      'F3','R' ,'C3','R' ,  'G3','R' ,'G3','R' ,
      'F3','R' ,'C3','R' ,  'F3','R' ,'C3','R' ,
      'G3','R' ,'D3','R' ,  'C3','R' ,'C3','R'
    ];
    const BGM_STEP_MS = 165;

    function playChipNote(ctx, freq, type, vol, dur) {
      if (!freq) return; // 休止符不發聲
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    function playBGM() {
      if (!bgmEnabled) return;
      const ctx = getAudioContext();
      stopBGM();

      let step = 0;
      bgmTimer = setInterval(() => {
        if (!bgmEnabled) return;
        const i = step % BGM_MELODY.length;
        // 音量壓得很低，才不會蓋過耳語提示音
        playChipNote(ctx, NOTE_HZ[BGM_MELODY[i]], 'square',   0.022, 0.13);
        playChipNote(ctx, NOTE_HZ[BGM_BASS[i]],   'triangle', 0.030, 0.16);
        step++;
      }, BGM_STEP_MS);
    }

    function stopBGM() {
      if (bgmTimer) {
        clearInterval(bgmTimer);
        bgmTimer = null;
      }
    }

    function playSoundEffect(type) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'pass') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'over') {
          [261, 329, 392, 523, 659].forEach((freq, idx) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
            g.gain.setValueAtTime(0.08, ctx.currentTime + idx * 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.25);
            o.connect(g);
            g.connect(ctx.destination);
            o.start(ctx.currentTime + idx * 0.08);
            o.stop(ctx.currentTime + idx * 0.08 + 0.25);
          });
        }
      } catch(e){}
    }

    /* ===================================================
       6. 遊戲流程控制
       =================================================== */
    function setMode(mode) {
      gameMode = mode;
      const btnRand = document.getElementById('btn-mode-random');
      const btnSeq = document.getElementById('btn-mode-seq');

      if (mode === 'random') {
        btnRand.className = "py-2.5 px-3 rounded-2xl font-bold text-sm border-2 transition-all flex items-center justify-center gap-2 bg-rose-500 text-white border-rose-600 shadow-md";
        btnSeq.className = "py-2.5 px-3 rounded-2xl font-bold text-sm border-2 transition-all flex items-center justify-center gap-2 bg-slate-100 text-slate-600 border-slate-300";
      } else {
        btnSeq.className = "py-2.5 px-3 rounded-2xl font-bold text-sm border-2 transition-all flex items-center justify-center gap-2 bg-rose-500 text-white border-rose-600 shadow-md";
        btnRand.className = "py-2.5 px-3 rounded-2xl font-bold text-sm border-2 transition-all flex items-center justify-center gap-2 bg-slate-100 text-slate-600 border-slate-300";
      }
    }

    function setTimer(sec) {
      timerSeconds = sec;
      document.querySelectorAll('.btn-time').forEach(btn => {
        if (parseInt(btn.getAttribute('data-time')) === sec) {
          btn.className = "btn-time py-2 rounded-xl text-xs font-bold border-2 bg-rose-500 text-white border-rose-600 shadow";
        } else {
          btn.className = "btn-time py-2 rounded-xl text-xs font-bold border-2 bg-slate-100 border-slate-300";
        }
      });
    }

    function startGame() {
      if (topics.length === 0) {
        alert("題目庫目前沒有題目，請點擊【管理/新增題目】新增！");
        return;
      }

      activeTopicPool = [...topics];
      if (gameMode === 'random') {
        for (let i = activeTopicPool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [activeTopicPool[i], activeTopicPool[j]] = [activeTopicPool[j], activeTopicPool[i]];
        }
      }

      currentTopicIndex = 0;
      score = 0;
      currentRemainingTime = timerSeconds;
      answerHistory = [];
      gameActive = true;
      isAnnouncing = false;
      setAnswerButtonsEnabled(true);
      document.getElementById('announce-banner').classList.add('hidden');

      document.getElementById('game-score').innerText = score;
      document.getElementById('game-timer').innerText = currentRemainingTime + "s";

      showScreen('screen-game');
      renderCurrentCard();
      startTimer();
      playBGM();
    }

    function renderCurrentCard() {
      if (currentTopicIndex >= activeTopicPool.length) {
        endGame();
        return;
      }

      const item = activeTopicPool[currentTopicIndex];
      document.getElementById('card-category').innerText = item.cat || "🎭 綜合表演";
      document.getElementById('card-topic-text').innerText = item.text;

      // 自動播報小聲音語音
      speakCurrentTopic();
    }

    function handleAnswer(isCorrect) {
      if (isAnnouncing) return;                                  // 複誦中，忽略連點
      if (currentTopicIndex >= activeTopicPool.length) return;

      const currentItem = activeTopicPool[currentTopicIndex];
      answerHistory.push({
        text: currentItem.text,
        isCorrect: isCorrect
      });

      if (isCorrect) {
        score++;
        document.getElementById('game-score').innerText = score;
        playSoundEffect('correct');
      } else {
        playSoundEffect('pass');
      }

      // 用正常音量、1.3 倍速大聲複誦一次題目，念完才換下一題
      announceAnswer(currentItem.text, () => {
        if (!gameActive) return;                                 // 期間時間到就不再換題
        currentTopicIndex++;
        renderCurrentCard();
      });
    }

    /* 公布答案：正常音量 + 1.3 倍速複誦，結束後執行 done() */
    function announceAnswer(text, done) {
      isAnnouncing = true;
      setAnswerButtonsEnabled(false);
      document.getElementById('announce-banner').classList.remove('hidden');

      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        clearTimeout(guardTimer);
        isAnnouncing = false;
        setAnswerButtonsEnabled(true);
        document.getElementById('announce-banner').classList.add('hidden');
        done();
      };

      // 保險：萬一 onend 沒被觸發（部分瀏覽器），最多等 5 秒就繼續
      const guardTimer = setTimeout(finish, 5000);

      if (!('speechSynthesis' in window)) {
        setTimeout(finish, 400);
        return;
      }

      window.speechSynthesis.cancel();
      // 先讓答對／跳過的音效響完，再開始複誦
      setTimeout(() => {
        if (finished) return;
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = 'zh-TW';
        utt.volume = 1.0;   // 正常音量，讓在場所有人都聽得到答案
        utt.rate = 1.3;     // 1.3 倍速
        utt.onend = finish;
        utt.onerror = finish;
        window.speechSynthesis.speak(utt);
      }, 320);
    }

    function setAnswerButtonsEnabled(enabled) {
      document.querySelectorAll('.btn-answer').forEach(btn => {
        btn.disabled = !enabled;
        btn.classList.toggle('opacity-40', !enabled);
        btn.classList.toggle('pointer-events-none', !enabled);
      });
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        currentRemainingTime--;
        document.getElementById('game-timer').innerText = currentRemainingTime + "s";

        if (currentRemainingTime <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameActive = false;
      isAnnouncing = false;
      clearInterval(timerInterval);
      stopBGM();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      setAnswerButtonsEnabled(true);
      document.getElementById('announce-banner').classList.add('hidden');
      playSoundEffect('over');

      document.getElementById('final-score').innerText = score;

      const listEl = document.getElementById('result-list');
      listEl.innerHTML = '';
      if (answerHistory.length === 0) {
        listEl.innerHTML = '<div class="text-slate-400">本局未答題</div>';
      } else {
        answerHistory.forEach(item => {
          const div = document.createElement('div');
          div.className = "flex justify-between items-center py-1 border-b border-slate-100";
          div.innerHTML = `
            <span class="font-bold ${item.isCorrect ? 'text-slate-800' : 'text-slate-400'}">${item.text}</span>
            <span class="${item.isCorrect ? 'text-emerald-500 font-black' : 'text-amber-500 font-bold'}">
              ${item.isCorrect ? '✓ 答對' : '✕ 跳過'}
            </span>
          `;
          listEl.appendChild(div);
        });
      }

      showScreen('screen-result');
    }

    /* ===================================================
       7. 題目庫編輯 Modal 管理
       =================================================== */
    function openTopicModal() {
      renderTopicList();
      document.getElementById('modal-topics').classList.remove('hidden');
    }

    function closeTopicModal() {
      document.getElementById('modal-topics').classList.add('hidden');
    }

    function renderTopicList() {
      const container = document.getElementById('topic-list-container');
      container.innerHTML = '';

      topics.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = "flex justify-between items-center bg-white p-2.5 rounded-xl border border-slate-200 text-xs shadow-sm";
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-lg text-[10px] font-bold">${item.cat}</span>
            <span class="font-bold text-slate-800">${item.text}</span>
          </div>
          <button onclick="removeTopic(${index})" class="text-rose-500 hover:text-rose-700 font-bold px-2 py-1 rounded">
            ✕
          </button>
        `;
        container.appendChild(row);
      });
    }

    function addNewTopic() {
      const input = document.getElementById('input-new-topic');
      const catSelect = document.getElementById('select-new-cat');
      const val = input.value.trim();

      if (!val) {
        alert("請輸入題目名稱！");
        return;
      }

      topics.unshift({
        text: val,
        cat: catSelect.value
      });

      input.value = '';
      saveTopicsToStorage();
      renderTopicList();
    }

    function removeTopic(idx) {
      topics.splice(idx, 1);
      saveTopicsToStorage();
      renderTopicList();
    }

    function resetDefaultTopics() {
      if (confirm("確定要將題目庫重置為預設的 " + DEFAULT_TOPICS.length + " 題嗎？")) {
        topics = [...DEFAULT_TOPICS];
        saveTopicsToStorage();
        renderTopicList();
      }
    }

    /* ===================================================
       8. UI 畫面切換 Utility
       =================================================== */
    function showScreen(screenId) {
      ['screen-home', 'screen-game', 'screen-result'].forEach(id => {
        const el = document.getElementById(id);
        if (id === screenId) {
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });
    }
  </script>
